<!DOCTYPE html>

  <!-- Tailwind CSS -->

  <script>
    tailwind.config = {

        extend: {
          colors: {

              blue: '#0866FF',
              blueDark: '#0557D5',
              blueLight: '#E7F0FD',

            'fb-card': '0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08)',
          }
        }
      }

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap" rel="stylesheet">

  <!-- React + ReactDOM + Babel (CDN) -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      background-color: #F0F2F5;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Fade-in do CTA ---- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cta-fadein {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ---- Pulse leve no botão CTA ---- */
    @keyframes softPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      50%       { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
    }
    .cta-pulse { animation: softPulse 2.4s ease-in-out infinite; }

    /* ---- Hover nos botões de ação do FB ---- */
    .fb-action-btn:hover { background-color: #E4E6EB; }

    /* ---- Avatar overlap ---- */
    .avatar-stack { display: flex; align-items: center; }
    .avatar-stack img { margin-left: -6px; border: 2px solid #fff; }
    .avatar-stack img:first-child { margin-left: 0; }

    /* Contador de progresso do CTA */
    @keyframes countdown {
      from { width: 100%; }
      to   { width: 0%;   }
    }
    .progress-bar {
      animation: countdown 360s linear forwards;
    }

    /* Link Reply indent */
    .reply-indent { margin-left: 44px; margin-top: 6px; }
  </style>

    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1409385944601105');

<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ══════════════════════════════════════════
   HELPERS / COMPONENTES ATÔMICOS
══════════════════════════════════════════ */

/* Ícone Verificado Azul (Facebook) */
function VerifiedBadge() {
  return (
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" className="inline-block ml-1 align-text-bottom">
      <circle cx="8" cy="8" r="8" fill="#0866FF"/>
      <path d="M4.5 8.5L6.5 10.5L11.5 5.5" stroke="white" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

/* Ícone Polegar Curtir — SVG idêntico ao joinha do Facebook */
function LikeIcon({ filled = false, size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? '#0866FF' : '#65676B'} xmlns="http://www.w3.org/2000/svg">
      {filled ? (
        /* Joinha preenchido (estado ativo) */
        <path d="M1 10.5h2.5v11H1V10.5zM6 21.5a1 1 0 001 1h9.5a1.5 1.5 0 001.47-1.2l1.53-7.6A1.5 1.5 0 0018 12h-5V5.5A2.5 2.5 0 0010.5 3h-.25a.75.75 0 00-.75.75V5a6.25 6.25 0 01-1.83 4.42L6.5 10.6A1 1 0 006 11.5v10z"/>
      ) : (
        /* Joinha vazado (estado inativo) */
        <path d="M14 9V5.5A2.5 2.5 0 0011.5 3h-.25a.75.75 0 00-.75.75V5c0 1.63-.8 3.17-2.14 4.1L7 10.17V21h9.14a1.5 1.5 0 001.48-1.26l1.3-8A1.5 1.5 0 0017.44 10H14zM5 10H3a1 1 0 00-1 1v10a1 1 0 001 1h2V10z" fillRule="evenodd" clipRule="evenodd"/>
      )}
    </svg>
  );
}

/* Ícone Comentar */
function CommentIcon() {
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#65676B" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
    </svg>
  );
}

/* Ícone Compartilhar */
function ShareIcon() {
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#65676B" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
    </svg>
  );
}

/* Ícone Globe */
function GlobeIcon() {
  return (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="#65676B" className="inline-block">
      <circle cx="12" cy="12" r="10" fill="#65676B" opacity="0.15"/>
      <path stroke="#65676B" strokeWidth="1.5" fill="none" d="M12 2a10 10 0 100 20A10 10 0 0012 2zm0 0c-2.4 2-4 5.6-4 10s1.6 8 4 10m0-20c2.4 2 4 5.6 4 10s-1.6 8-4 10M2 12h20"/>
    </svg>
  );
}

/* Avatar */
function Avatar({ src, size = 40, alt = '' }) {
  return (
    <img
      src={src}
      alt={alt}
      width={size}
      height={size}
      className="rounded-full object-cover flex-shrink-0"
      style={{ width: size, height: size }}
    />
  );
}

/* Botão Like de Comentário */
function CommentLikeBtn({ count }) {
  const [liked, setLiked] = useState(false);
  const [likes, setLikes] = useState(count);
  const toggle = () => {
    if (liked) {
      setLiked(false);
      setLikes(l => l - 1);
    } else {
      setLiked(true);
      setLikes(l => l + 1);
    }
  };
  return (
    <span className="flex items-center gap-1">
      <button onClick={toggle} className={`font-semibold text-xs hover:underline ${liked ? 'text-[#0866FF]' : 'text-[#65676B]'}`}>
        Curtir
      </button>
      {likes > 0 && (
        <span className="flex items-center gap-0.5 ml-1">
          <span className="text-xs text-[#65676B]">{likes.toLocaleString('pt-BR')}</span>
        </span>
      )}
    </span>
  );
}

/* ══════════════════════════════════════════
   COMPONENTE DE COMENTÁRIO SIMPLES
══════════════════════════════════════════ */
function Comment({ avatar, name, text, time, likes, isAuthor = false, children }) {
  return (
    <div className="flex gap-2">
      <Avatar src={avatar} size={36} alt={name} />
      <div className="flex-1 min-w-0">
        <div className="bg-[#F0F2F5] rounded-2xl px-3 py-2 inline-block max-w-[88%] md:max-w-[90%]">
          <div className="flex items-center gap-1 flex-wrap">
            <span className="font-semibold text-sm text-[#050505]">{name}</span>
            {isAuthor && (
              <span className="text-[10px] font-semibold text-[#0866FF] bg-[#E7F0FD] px-1.5 py-0.5 rounded-full">Autora</span>
            )}
          </div>
          <p className="text-sm text-[#050505] mt-0.5 leading-snug">{text}</p>
        </div>
        <div className="flex items-center gap-3 mt-1 ml-1 flex-wrap">
          <CommentLikeBtn count={likes} />
          <button className="text-xs font-semibold text-[#65676B] hover:underline">Responder</button>
          <span className="text-xs text-[#65676B]">{time}</span>
        </div>
        {/* Respostas aninhadas */}
        {children && (
          <div className="reply-indent mt-2 space-y-2.5">
            {children}
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   COMPONENTE PRINCIPAL: ADVERTORIAL VSL
══════════════════════════════════════════ */
function FacebookVSL() {
  /* ---- Estado: Curtidas do Post ---- */
  const INITIAL_LIKES = 12000;
  const [postLiked, setPostLiked] = useState(false);
  const [postLikes, setPostLikes] = useState(INITIAL_LIKES);

  /* ---- Estado & Refs: Player YouTube Blindado ---- */
  const [overlayVisible, setOverlayVisible] = useState(true);
  const iframeRef = useRef(null);
  const ytPlayerRef = useRef(null);

  /* ---- Estado: Visibilidade do CTA (Disparado EXATAMENTE ao clicar no Play: 6 min / 360.000 ms) ---- */
  const [ctaVisible, setCtaVisible] = useState(false);
  const ctaTimerRef = useRef(null);

  useEffect(() => {
    // Garante que nenhuma flag anterior force visibilidade ao abrir
    try {
      localStorage.removeItem('mf_vsl_cta_shown');
      localStorage.removeItem('mf_vsl_arrival');
    } catch (e) {}

    // Inicializa a API do YouTube quando carregada
    const initYT = () => {
      if (window.YT && window.YT.Player) {
        try {
          ytPlayerRef.current = new window.YT.Player('vsl-youtube-player', {
            events: {
              onReady: () => {
                // Player pronto
              }
            }
          });
        } catch (e) {
          // Fallback silencioso para postMessage
        }
      }
    };

    if (window.YT && window.YT.Player) {
      initYT();
    } else {
      window.onYouTubeIframeAPIReady = initYT;
    }

    return () => {
      if (ctaTimerRef.current) {
        clearTimeout(ctaTimerRef.current);
      }
    };
  }, []);

  const handlePlayClick = () => {
    setOverlayVisible(false);

    // Inicia o timer de 360.000 ms (6 minutos) EXATAMENTE no momento do Play
    if (ctaTimerRef.current) clearTimeout(ctaTimerRef.current);
    ctaTimerRef.current = setTimeout(() => {
      setCtaVisible(true);
    }, 360000);

    // 1. Aciona play e unMute via postMessage direto no contentWindow (instantâneo)
    if (iframeRef.current && iframeRef.current.contentWindow) {
      iframeRef.current.contentWindow.postMessage(
        JSON.stringify({ event: 'command', func: 'unMute', args: [] }),
        '*'
      );
      iframeRef.current.contentWindow.postMessage(
        JSON.stringify({ event: 'command', func: 'playVideo', args: [] }),
        '*'
      );
    }

    // 2. Aciona via objeto YT Player se disponível
    if (ytPlayerRef.current && typeof ytPlayerRef.current.playVideo === 'function') {
      try {
        ytPlayerRef.current.unMute();
        ytPlayerRef.current.playVideo();
      } catch (err) {
        // Fallback já executado pelo postMessage
      }
    }
  };

  const handlePostLike = () => {
    if (postLiked) {
      setPostLiked(false);
      setPostLikes(l => l - 1);
    } else {
      setPostLiked(true);
      setPostLikes(l => l + 1);
    }
  };

  /* ---- URL de Destino ---- */
  const LP_URL = 'oferta.html#planos';

  /* ---- Formatadores ---- */
  const fmtLikes = (n) => {
    if (n >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1).replace('.', ',') + ' mil';
    return n.toLocaleString('pt-BR');
  };

  /* ══════════════════════════════════════════
     RENDER
  ══════════════════════════════════════════ */
  return (
    <div className="min-h-screen bg-[#F0F2F5]">

      {/* ── HEADER FAKE DO FACEBOOK (Barra Superior Compacta) ── */}
      <header className="bg-white border-b border-[#CDD1D5] sticky top-0 z-30 shadow-sm">
        <div className="max-w-[680px] mx-auto px-3 sm:px-4 h-10 sm:h-11 flex items-center justify-between">
          {/* Logo Facebook Compacto */}
          <svg height="28" viewBox="0 0 60 60" fill="#0866FF" className="sm:h-8">
            <path d="M55.44 0H4.56C2.04 0 0 2.04 0 4.56v50.88C0 57.96 2.04 60 4.56 60h27.36V36.84H24.3v-9.12h7.62v-6.72c0-7.56 4.62-11.7 11.4-11.7 3.24 0 6.6.24 9.84.72v7.8h-6.72c-3.6 0-4.32 1.74-4.32 4.26v5.64h8.64l-1.14 9.12H42.12V60h13.32C57.96 60 60 57.96 60 55.44V4.56C60 2.04 57.96 0 55.44 0z"/>
          </svg>

        </div>
      </header>

      {/* ── CONTEÚDO PRINCIPAL (Compacto para o vídeo aparecer de imediato) ── */}
      <main className="max-w-[680px] mx-auto px-0 sm:px-2 pt-1 sm:pt-2 pb-6 sm:pb-8">

        {/* ── POST CARD ── */}
        <article className="bg-white w-full rounded-none sm:rounded-lg shadow-sm border-y sm:border border-[#CDD1D5] overflow-hidden">

          {/* Post Header Compacto */}
          <div className="px-3 sm:px-4 py-2 flex items-center gap-2.5">
            <div className="relative flex-shrink-0">
              <Avatar src="https://randomuser.me/api/portraits/women/44.jpg" size={38} alt="Dra. Mariana Alves"/>
              {/* Ícone de página azul no avatar */}
              <div className="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[#0866FF] rounded-full flex items-center justify-center border border-white">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
              </div>
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center flex-wrap gap-x-1 leading-tight">
                <span className="font-bold text-[14px] sm:text-[15px] text-[#050505] hover:underline cursor-pointer">
                  Dra. Mariana Alves
                </span>
                <VerifiedBadge />
                <span className="text-[12px] text-[#65676B] font-normal">· 513 mil seguidores</span>
              </div>
              <div className="flex items-center gap-1 mt-0.5 leading-none">
                <span className="text-[11px] sm:text-[12px] text-[#65676B]">Ontem às 19:30</span>
                <span className="text-[#65676B] text-[11px]">·</span>
                <GlobeIcon />
              </div>
            </div>
            {/* Menu 3 pontinhos */}
            <button className="w-7 h-7 rounded-full flex items-center justify-center hover:bg-[#F0F2F5] flex-shrink-0 text-[#65676B]">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
              </svg>
            </button>
          </div>

          {/* Texto do Post - Exato e Direto */}
          <div className="px-3 sm:px-4 pt-0 pb-1 mb-3">
            <p className="text-[13.5px] sm:text-[14.5px] text-[#050505] leading-snug">
              O erro de 93% das mães: por que os abdominais tradicionais estão <strong>destruindo a sua barriga</strong>.
            </p>
            <p className="text-[13.5px] sm:text-[14.5px] text-[#050505] leading-snug mt-1">
              Assista o vídeo até o final com o som ligado — eu revelo o atalho de <strong>5 minutos para fechar a diástase de dentro para fora</strong> e resgatar o seu corpo de antes da gravidez, tudo isso enquanto seu bebê dorme. 👇
            </p>
          </div>

          {/* ── Player de Vídeo Vertical (YouTube Blindado 9:16) ── */}
          <div className="w-full flex justify-center bg-black py-2 px-2 sm:px-0">
            <div className="aspect-[9/16] w-full max-w-[340px] mx-auto md:max-w-[380px] overflow-hidden rounded-lg shadow-2xl bg-black relative">
              {/* Iframe Oficial do YouTube (controles ocultos e API ativada) */}
              <iframe
                id="vsl-youtube-player"
                ref={iframeRef}
                src="https://www.youtube.com/embed/PwR9cgjmR_c?controls=0&rel=0&modestbranding=1&playsinline=1&disablekb=1&enablejsapi=1"
                title="Vídeo VSL"
                className="w-full h-full border-0 block"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowFullScreen
              ></iframe>

              {/* O Escudo Invisível (Bloqueio total de cliques e navegação para fora) */}
              <div
                className="absolute inset-0 z-10 bg-transparent select-none cursor-default"
                onClick={(e) => { e.preventDefault(); e.stopPropagation(); }}
                onContextMenu={(e) => e.preventDefault()}
                aria-hidden="true"
              ></div>

              {/* Overlay Escurecido Inicial com Botão Gigante de Play */}
              {overlayVisible && (
                <div
                  className="absolute inset-0 z-20 flex flex-col items-center justify-center gap-4 cursor-pointer bg-gradient-to-b from-[#1a0a0d]/90 via-[#2D070D]/85 to-[#1a0a0d]/90 px-4 text-center transition-all duration-300"
                  onClick={handlePlayClick}
                >
                  <div className="text-white">
                    <span className="inline-block bg-rose-600/90 text-white text-[10px] sm:text-xs font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full mb-2">
                      VÍDEO EXCLUSIVO
                    </span>
                    <p className="text-base sm:text-lg font-black text-white leading-tight max-w-[280px] drop-shadow">
                      Como fechar a diástase em 5 minutos por dia
                    </p>
                    <p className="text-[11px] text-rose-200 mt-1 font-medium">
                      Dra. Mariana Alves | MANP
                    </p>
                  </div>

                  <div className="flex flex-col items-center gap-2 mt-1">
                    <div className="animate-pulse w-20 h-20 sm:w-22 sm:h-22 bg-white/20 border-4 border-white rounded-full flex items-center justify-center shadow-2xl hover:bg-white/30 transition-all transform hover:scale-105">
                      <svg width="40" height="40" viewBox="0 0 24 24" fill="white" className="ml-2">
                        <polygon points="5,3 19,12 5,21"/>
                      </svg>
                    </div>
                    <p className="text-white font-black text-sm sm:text-base tracking-wide drop-shadow-lg">
                      ▶ CLIQUE PARA ASSISTIR
                    </p>
                  </div>

                  <p className="text-[11px] text-white/70 font-medium flex items-center gap-1 mt-1">
                    <span>🔊</span> Toque para assistir com som ativado
                  </p>
                </div>
              )}
            </div>
          </div>

          {/* Contador de Engajamento */}
          <div className="px-3 sm:px-4 py-2 mt-2.5 flex items-center justify-between border-b border-[#CDD1D5]">
            {/* Reações */}
            <div className="flex items-center gap-1.5 cursor-pointer hover:underline" title="Ver reações">
              <div className="avatar-stack">
                {/* Ícone Curtir */}
                <span className="w-5 h-5 bg-[#0866FF] rounded-full inline-flex items-center justify-center border-2 border-white" style={{zIndex:2}}>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="white">
                    <path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3M15 22H18a2 2 0 002-2v-5a2 2 0 00-2-2h-3M15 22V13c0-3.3-2-6-5-7L7 5V3a2 2 0 012-2 6 6 0 016 6v2h3a2 2 0 012 2v.5"/>
                  </svg>
                </span>
                {/* Ícone Coração */}
                <span className="w-5 h-5 bg-red-500 rounded-full inline-flex items-center justify-center border-2 border-white" style={{zIndex:1, marginLeft:-6}}>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="white">
                    <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
                  </svg>
                </span>
              </div>
              <span className="text-[13px] text-[#65676B]">
                {fmtLikes(postLikes)}
              </span>
            </div>

            {/* Comentários e Compartilhamentos */}
            <div className="flex items-center gap-2 text-[13px] text-[#65676B]">
              <span className="hover:underline cursor-pointer">263 comentários</span>
              <span>·</span>
              <span className="hover:underline cursor-pointer">42 compartilhamentos</span>
            </div>
          </div>

          {/* Botões de Ação do Facebook */}
          <div className="px-2 py-1 flex items-center justify-around border-b border-[#CDD1D5]">

            {/* Curtir */}
            <button
              onClick={handlePostLike}
              className={`fb-action-btn flex-1 h-9 flex items-center justify-center gap-1.5 rounded-md text-sm font-semibold transition-colors ${
